[package]
name = "bevy_sol"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "GI-1.2-inspired hybrid screen probes, world radiance caching, and reflections for Bevy"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d_bevy_render", "multi_threaded", "bevy_log"] }
bevy_slang = { path = "../bevy_slang", features = ["spirv_passthrough"] }

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "bevy_log"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
